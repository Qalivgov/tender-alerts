<style>
:root {
  --navy: #10253d;
  --sky: #c2dcff;
  --mist: #f2f2f3;
  --alert: #ff8a80;
  --display: "Syne Variable", "Glock Grotesk", ui-sans-serif, system-ui, sans-serif;
  --sans: "Open Sauce Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 16px;
  background-color: var(--navy);
  background-image:
    linear-gradient(rgba(242, 242, 243, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(242, 242, 243, 0.06) 1px, transparent 1px);
  background-size: 100% 88px, 33.333% 100%;
  color: var(--mist);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-align: center;
}
.brand { display: inline-flex; align-items: center; gap: 12px; }
.brand .symbol { width: 32px; height: 32px; }
.brand .wordmark { height: 16px; width: auto; }
.lock {
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  margin: 72px 0 0;
  border: 1px solid rgba(242, 242, 243, 0.18);
  border-radius: 20px;
  background: rgba(242, 242, 243, 0.05);
  color: rgba(242, 242, 243, 0.7);
}
.lock svg { width: 30px; height: 30px; }
h1 {
  margin: 36px 0 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(30px, 7vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.sub {
  margin: 14px 0 0;
  font-family: var(--mono);
  font-size: 15px;
  color: rgba(242, 242, 243, 0.5);
}
.code {
  position: relative;
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 52px 0 0;
}
.code input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  font-size: 16px;
  border: 0;
  cursor: text;
}
.box {
  display: grid;
  place-items: center;
  width: min(64px, calc((100vw - 32px - 50px) / 6));
  aspect-ratio: 4 / 5;
  border: 1px solid rgba(242, 242, 243, 0.16);
  border-radius: 12px;
  background: rgba(242, 242, 243, 0.04);
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 600;
  text-transform: uppercase;
}
.code:focus-within .box.active {
  border-color: var(--sky);
  box-shadow: 0 0 0 3px rgba(194, 220, 255, 0.28);
  background: rgba(242, 242, 243, 0.08);
}
.code:focus-within .box.active:empty::after {
  content: "";
  width: 2px;
  height: 40%;
  background: var(--mist);
  animation: blink 1.1s steps(1) infinite;
}
.code.error .box { border-color: var(--alert); }
.code.error { animation: shake 0.35s; }
.status {
  min-height: 20px;
  margin: 18px 0 0;
  font-size: 14px;
  color: var(--alert);
}
.rule {
  width: min(520px, 100%);
  height: 1px;
  margin: 28px 0 0;
  background: rgba(242, 242, 243, 0.14);
}
.hint {
  margin: 28px 0 0;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(242, 242, 243, 0.4);
}
.hint::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 12px;
  border-radius: 50%;
  background: var(--sky);
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes shake {
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
@media (prefers-reduced-motion: reduce) {
  .code.error, .box.active:empty::after { animation: none; }
}
</style>

const STORE = 'qalix-tender-code';
const entry = document.getElementById('entry');
const code = document.getElementById('code');
const statusLine = document.getElementById('status');
const boxes = [...document.querySelectorAll('.box')];
const bytes = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));

async function decrypt(attempt) {
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(attempt.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
    material, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bytes(payload.iv) }, key, bytes(payload.data));
  const page = new TextDecoder().decode(plain);
  if (!page.startsWith('<!doctype html>')) throw new Error('wrong code');
  return page;
}

function show(page) {
  document.open();
  document.write(page);
  document.close();
}

function paint() {
  boxes.forEach((box, index) => {
    box.textContent = entry.value[index] || '';
    box.classList.toggle('active', index === Math.min(entry.value.length, boxes.length - 1));
  });
}

async function submit() {
  const attempt = entry.value;
  try {
    const page = await decrypt(attempt);
    try { localStorage.setItem(STORE, attempt); } catch (error) {}
    show(page);
  } catch (error) {
    code.classList.add('error');
    statusLine.textContent = 'Incorrect code. Try again.';
    setTimeout(() => { code.classList.remove('error'); entry.value = ''; paint(); }, 500);
  }
}

entry.addEventListener('input', () => {
  statusLine.textContent = '';
  paint();
  if (entry.value.length === boxes.length) submit();
});
paint();

// Returning visitors on the same device skip the prompt.
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (error) {}
  if (!saved) return;
  try { show(await decrypt(saved)); } catch (error) {
    try { localStorage.removeItem(STORE); } catch (ignored) {}
  }
})();
</script>
